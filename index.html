<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zikirmatik</title>
<style>
  :root { --paper:#F1ECE2; --alt:#E8E1D3; --ink:#1D1B18; --muted:#5F584E; --line:#CFC6B5; --accent:#8E2F1F; --on:#F7F2EA; }
  @media (prefers-color-scheme: dark) { :root { --paper:#12100E; --alt:#1C1916; --ink:#EDE6D8; --muted:#A39A8B; --line:#34302A; --accent:#D9805F; --on:#12100E; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.6 -apple-system, system-ui, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:56px 20px 64px; }
  .eyebrow { font-size:13px; color:var(--muted); letter-spacing:.04em; }
  h1 { font:400 38px/1.1 "New York", Georgia, serif; margin:8px 0 14px; }
  p { margin:0 0 14px; }
  .code { font:500 30px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing:.12em; padding:18px 0; margin:22px 0;
          border-top:1px solid var(--line); border-bottom:1px solid var(--line); text-align:center; }
  .btn { display:block; text-align:center; text-decoration:none; padding:15px 18px; border-radius:6px; font-weight:600; margin:10px 0; }
  .primary { background:var(--accent); color:var(--on); }
  .secondary { border:1px solid var(--ink); color:var(--ink); }
  .muted { color:var(--muted); font-size:14px; }
  footer { margin-top:40px; font-size:13px; color:var(--muted); }
  footer a { color:var(--muted); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">ZİKİRMATİK</div>
  <h1>Sade, reklamsız zikirmatik</h1>
  <p>Ekrana bakmadan sayabilmen için ayırt edilen titreşimler, namaz sonrası tesbihat, ortak zikir ve ortak hatim, namaz vakitleri. Hesap yok, reklam yok, verilerin yalnızca senin iCloud’unda.</p>
  <p class="muted">iPhone ve Apple Watch için. Yakında App Store’da.</p>
  <footer><a href="/privacy.html">Gizlilik</a> · <a href="/support.html">Destek</a></footer>
</main>
</body>
</html>
